<!-- start plan -->
<section class="section bg-light" id="plans">
    <div class="bg-overlay bg-overlay-pattern"></div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-5">
                    <h3 class="mb-3 fw-semibold">Choose the plan that's right for you</h3>
                    <p class="text-muted mb-4">Simple, transparent pricing. No hidden fees. Advanced features for
                        businesses of all sizes.</p>

                    <!-- <div class="d-flex justify-content-center align-items-center">
                        <div>
                            <h5 class="fs-14 mb-0">Month</h5>
                        </div>
                        <div class="form-check form-switch fs-20 ms-3 " (click)="check()">
                            <input class="form-check-input" type="checkbox" id="plan-switch">
                            <label class="form-check-label" for="plan-switch"></label>
                        </div>
                        <div>
                            <h5 class="fs-14 mb-0">Annual <span class="badge bg-success-subtle text-success">Save
                                    20%</span></h5>
                        </div>
                    </div> -->
                </div>
            </div>
            <!-- end col -->
        </div>
        <!-- end row -->

        <div class="row gy-4">
            <div class="col-lg-4" *ngFor="let plan of plans">
                <div class="card plan-box mb-0" [ngClass]="{'ribbon-box right': plan.popular}">
                    <div class="card-body p-4 m-2">

                        <!-- Ribbon -->
                        <div *ngIf="plan.popular" class="ribbon-two ribbon-two-danger">
                            <span>Popular</span>
                        </div>

                        <!-- Header -->
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h5 class="mb-1 fw-semibold">{{ plan.name }}</h5>
                                <p class="text-muted mb-0">{{ plan.subtitle }}</p>
                            </div>
                            <div class="avatar-sm">
                                <div class="avatar-title bg-light rounded-circle text-primary">
                                    <i class="{{ plan.icon }} fs-20"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Pricing -->
                        <div class="py-4 text-center">
                            <h1 class="month" *ngIf="plan.monthly !== 'Custom'">
                                <sup><small>$</small></sup>
                                <span class="ff-secondary fw-bold">{{ plan.monthly }}</span>
                                <span class="fs-13 text-muted">/Month</span>
                            </h1>
                            <h1 class="month" *ngIf="plan.monthly === 'Custom'">
                                <span class="ff-secondary fw-bold">${{ plan.monthly }}</span>
                            </h1>

                            <!-- <h1 class="annual" *ngIf="plan.yearly !== 'Custom'">
                                <sup><small>$</small></sup>
                                <span class="ff-secondary fw-bold">{{ plan.yearly }}</span>
                                <span class="fs-13 text-muted">/Year</span>
                            </h1>
                            <h1 class="annual" *ngIf="plan.yearly === 'Custom'">
                                <span class="ff-secondary fw-bold">${{ plan.yearly }}</span>
                            </h1> -->
                        </div>

                        <!-- Features -->
                        <ul class="list-unstyled text-muted vstack gap-3 ff-secondary">
                            <li *ngFor="let feature of plan.features">
                                <div class="d-flex">
                                    <div class="flex-shrink-0 me-1"
                                        [ngClass]="feature.included ? 'text-success' : 'text-danger'">
                                        <i [ngClass]="feature.included ? 'ri-checkbox-circle-fill' : 'ri-close-circle-fill'"
                                            class="fs-15 align-middle"></i>
                                    </div>
                                    <div class="flex-grow-1" [innerHTML]="feature.text"></div>
                                </div>
                            </li>
                        </ul>

                        <!-- Button -->
                        <div class="mt-4">
                            <a href="javascript:void(0);" class="btn btn-soft-success w-100">Get Started</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!--end row-->
    </div>
    <!-- end container -->
</section>
<!-- end plan -->
